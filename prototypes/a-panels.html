<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jim Santora · Panels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: lazygit-style. Numbered panels stacked on the left, one detail pane on the right, key hints along the bottom. */
:root {
  color-scheme: dark;
  --bg: #0e1117;        /* blue-biased ink */
  --fg: #d5d9e0;
  --dim: #6d7586;
  --line: #333a48;       /* inactive border */
  --active: #8fd27f;     /* active border, lazygit green */
  --sel: #22395a;        /* selected row */
  --cyan: #6cc4dd;
  --yellow: #e2c178;
  --magenta: #c792ea;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); }
a { color: var(--cyan); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 1px dashed var(--active); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(300px, 38%) 1fr;
  grid-template-rows: 1fr auto;
  gap: 14px 10px;
  padding: 14px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px));
}
.side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

.panel {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 2px 8px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  cursor: default;
}
.panel.on { border-color: var(--active); }
.ptitle {
  position: absolute; top: -0.78em; left: 10px;
  margin: 0; padding: 0 5px;
  font: inherit; font-weight: 400;
  background: var(--bg); color: var(--fg);
  cursor: pointer;
}
.panel.on .ptitle { color: var(--active); font-weight: 700; }
.pcount {
  position: absolute; bottom: -0.8em; right: 10px;
  padding: 0 5px; background: var(--bg); color: var(--dim); font-size: 12px;
}
.panel.on .pcount { color: var(--active); }
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

#p-status { flex: 0 0 auto; }
#p-exp { flex: 4 1 0; }
#p-skills { flex: 3 1 0; }
#p-credits { flex: 4 1 0; }

.status { padding: 0 10px; }
.status b { color: var(--active); }
.status .arrow { color: var(--dim); }

ul.rows { list-style: none; margin: 0; padding: 0; }
.rows li {
  display: grid; gap: 1ch; padding: 0 10px; white-space: nowrap; cursor: pointer;
}
.rows li > * { overflow: hidden; text-overflow: ellipsis; }
.rows li:hover { background: color-mix(in srgb, var(--sel) 45%, transparent); }
.rows li.sel { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.panel.on .rows li.sel { background: var(--sel); }
.exp li { grid-template-columns: 4ch minmax(0, 15ch) minmax(0, 1fr); }
.skl li { grid-template-columns: minmax(0, 1fr) 3ch; }
.cr li { grid-template-columns: 4ch minmax(0, 1fr); }
.yr { color: var(--yellow); font-variant-numeric: tabular-nums; }
.co { color: var(--fg); }
.ti { color: var(--dim); }
.n { color: var(--magenta); text-align: right; }

/* main pane */
.main { grid-row: 1; grid-column: 2; }
.main .scroll { padding: 6px 18px 14px; }
.main h1 { font-size: 18px; margin: 4px 0 2px; color: var(--fg); text-wrap: balance; }
.main h2 { font-size: 14px; margin: 18px 0 6px; color: var(--active); }
.meta { color: var(--dim); margin: 0 0 12px; }
.meta .yr { margin-right: 1ch; }
.main p { max-width: 72ch; margin: 0 0 12px; }
.main ul.b { list-style: none; padding: 0; margin: 0; max-width: 80ch; }
.main ul.b li { padding-left: 2ch; text-indent: -2ch; margin-bottom: 8px; }
.main ul.b li::before { content: "- "; color: var(--dim); }
.tags { display: flex; flex-wrap: wrap; gap: 4px 2ch; margin: 0; padding: 0; list-style: none; }
.tags li { color: var(--cyan); }
.used { color: var(--dim); }
.used em { color: var(--fg); font-style: normal; }
.art { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.art img { width: 220px; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 2ch; margin: 0; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; }

.keys {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; gap: 0 2ch; align-items: center;
  color: var(--cyan); font-size: 13px; white-space: nowrap;
}
.keys .k { color: var(--fg); }
.keys .sp { flex: 1; }
.keys a { text-decoration: none; }
.keys a:hover { text-decoration: underline; }

/* Phone: one column, the page scrolls, the detail pane follows the active panel. */
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; gap: 18px; }
  .side { display: contents; }
  .panel, .main { flex: none !important; }
  .scroll { overflow: visible; }
  .exp li { grid-template-columns: 4ch minmax(0, 1fr); }
  .exp .ti { display: none; }
  .keys { order: -1; }
  .keys .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="side">
    <section class="panel" id="p-status" data-i="0">
      <h2 class="ptitle">[1] Status</h2>
      <div class="status" id="status"></div>
    </section>
    <section class="panel" id="p-exp" data-i="1">
      <h2 class="ptitle">[2] Experience</h2>
      <div class="scroll"><ul class="rows exp" id="l-exp"></ul></div>
      <span class="pcount" id="c-exp"></span>
    </section>
    <section class="panel" id="p-skills" data-i="2">
      <h2 class="ptitle">[3] Skills</h2>
      <div class="scroll"><ul class="rows skl" id="l-skills"></ul></div>
      <span class="pcount" id="c-skills"></span>
    </section>
    <section class="panel" id="p-credits" data-i="3">
      <h2 class="ptitle">[4] Game credits</h2>
      <div class="scroll"><ul class="rows cr" id="l-credits"></ul></div>
      <span class="pcount" id="c-credits"></span>
    </section>
  </div>
  <section class="panel main" id="main" aria-live="polite">
    <h2 class="ptitle" id="main-title">Main</h2>
    <div class="scroll" id="detail"></div>
  </section>
  <footer class="keys">
    <span class="hint">Select: <span class="k">click</span> / <span class="k">↑↓</span></span>
    <span class="hint">Panel: <span class="k">1–4</span> / <span class="k">←→</span></span>
    <span class="sp"></span>
    <a id="gh" href="#" target="_blank" rel="noopener">github ↗</a>
    <a id="li" href="#" target="_blank" rel="noopener">linkedin ↗</a>
  </footer>
</div>
<script src="data.js"></script>
<script>
(() => {
  const R = window.RESUME;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const year = p => (p.match(/\d{4}/) || [''])[0];

  $('gh').href = R.links.github.href;
  $('li').href = R.links.linkedin.href;

  $('status').innerHTML =
    `<b>${esc(R.profile.name)}</b> <span class="arrow">→</span> ${esc(R.profile.title)}<br>` +
    `<span class="ti">${esc(R.profile.discipline)}</span>`;

  const lists = [
    { panel: 'p-status', items: [null] },
    { panel: 'p-exp', list: 'l-exp', count: 'c-exp', items: R.jobs,
      row: j => `<span class="yr">${year(j.period)}</span><span class="co">${esc(j.company.split(' / ')[0])}</span><span class="ti">${esc(j.title)}</span>` },
    { panel: 'p-skills', list: 'l-skills', count: 'c-skills', items: R.skills,
      row: s => `<span>${esc(s.label)}</span><span class="n">${s.items.length}</span>` },
    { panel: 'p-credits', list: 'l-credits', count: 'c-credits', items: R.credits,
      row: c => `<span class="yr">${c.year}</span><span>${esc(c.title)}</span>` },
  ];
  const sel = [0, 1, 0, 0]; // Experience opens on Epic Games (2K has no bullets yet)
  let active = 0;

  lists.forEach((L, i) => {
    if (!L.list) return;
    const ul = $(L.list);
    ul.innerHTML = L.items.map((it, k) => `<li data-k="${k}" title="${esc(it.title || it.label || '')}">${L.row(it)}</li>`).join('');
    ul.addEventListener('click', e => {
      const li = e.target.closest('li');
      if (li) { sel[i] = +li.dataset.k; focus(i); }
    });
  });
  document.querySelectorAll('.side .panel').forEach(p =>
    p.addEventListener('click', e => { if (!e.target.closest('li')) focus(+p.dataset.i); }));

  // Which jobs mention a skill (plain text search over the job bullets).
  const mentions = item => {
    const re = new RegExp('\\b' + item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    return [...new Set(R.jobs.filter(j => j.details.some(d => re.test(d))).map(j => j.company.split(' / ')[0]))];
  };

  const views = [
    () => ({
      title: 'About',
      html: `<h1>${esc(R.profile.name)}</h1>
        <p class="meta">${esc(R.profile.title)} · ${esc(R.profile.discipline)}</p>
        ${R.about.map(p => `<p>${esc(p)}</p>`).join('')}
        <h2>Focus</h2><ul class="tags">${R.specialties.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        <h2>Elsewhere</h2>
        <dl class="kv"><dt>GitHub</dt><dd><a href="${R.links.github.href}" target="_blank" rel="noopener">${R.links.github.label}</a></dd>
        <dt>LinkedIn</dt><dd><a href="${R.links.linkedin.href}" target="_blank" rel="noopener">${R.links.linkedin.label}</a></dd></dl>`,
    }),
    k => {
      const j = R.jobs[k];
      return {
        title: j.company.split(' / ')[0],
        html: `<h1>${esc(j.title)}</h1>
          <p class="meta">${esc(j.company)} · <span class="yr">${esc(j.period)}</span></p>
          ${j.details.length ? `<ul class="b">${j.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : `<p class="ti">Current role.</p>`}`,
      };
    },
    k => {
      const s = R.skills[k];
      return {
        title: s.label,
        html: `<h1>${esc(s.label)}</h1><p class="meta">${s.items.length} tools</p>
          <dl class="kv">${s.items.map(it => {
            const m = mentions(it);
            return `<dt style="color:var(--cyan)">${esc(it)}</dt><dd class="used">${m.length ? 'used at <em>' + m.map(esc).join('</em>, <em>') + '</em>' : ''}</dd>`;
          }).join('')}</dl>`,
      };
    },
    k => {
      const c = R.credits[k];
      return {
        title: c.title,
        html: `<div class="art"><img src="${c.image}" alt="${esc(c.title)} box art" width="220">
          <div><h1>${esc(c.title)}</h1><p class="meta"><span class="yr">${c.year}</span></p>
          <dl class="kv"><dt>Credited as</dt><dd>${esc(c.role)}</dd></dl></div></div>`,
      };
    },
  ];

  function render() {
    document.querySelectorAll('.side .panel').forEach((p, i) => p.classList.toggle('on', i === active));
    lists.forEach((L, i) => {
      if (!L.list) return;
      [...$(L.list).children].forEach((li, k) => li.classList.toggle('sel', k === sel[i]));
      $(L.count).textContent = `${sel[i] + 1} of ${L.items.length}`;
    });
    const v = views[active](sel[active]);
    $('main-title').textContent = v.title;
    $('detail').innerHTML = v.html;
    $('detail').scrollTop = 0;
    // Phone: put the detail pane right after the active panel.
    document.querySelectorAll('.side .panel').forEach((p, i) => (p.style.order = i * 2));
    $('main').style.order = active * 2 + 1;
    const L = lists[active];
    if (L.list) $(L.list).children[sel[active]]?.scrollIntoView({ block: 'nearest' });
  }
  function focus(i) { active = i; render(); }

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const n = lists[active].items.length;
    if (e.key === 'ArrowDown' || e.key === 'j') { sel[active] = Math.min(n - 1, sel[active] + 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { sel[active] = Math.max(0, sel[active] - 1); render(); e.preventDefault(); }
    else if (/^[1-4]$/.test(e.key)) focus(+e.key - 1);
    else if (e.key === 'ArrowRight' || e.key === 'l') { focus((active + 1) % 4); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'h') { focus((active + 3) % 4); e.preventDefault(); }
  });

  active = 1; // open on Experience, newest role selected
  render();
})();
</script>
</body>
</html>
