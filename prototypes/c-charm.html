<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jim Santora · Charm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: bubbletea/lipgloss-style. Name badge, tab row joined to a rounded window, list + detail inside, help line below. */
:root {
  --bg: #f7f5fc;
  --fg: #2b2540;
  --dim: #8a83a3;
  --faint: #d9d3ea;
  --purple: #6b45e8;
  --pink: #e0457f;
  --green: #0a9a62;
  --badge-fg: #ffffff;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --fg: #e9e5f5; --dim: #7f7898; --faint: #3a3350;
    --purple: #8b6cf7; --pink: #ff6b9d; --green: #2fd08a; --badge-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --fg: #e9e5f5; --dim: #7f7898; --faint: #3a3350;
  --purple: #8b6cf7; --pink: #ff6b9d; --green: #2fd08a; --badge-fg: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.6 var(--mono); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px dashed var(--pink); outline-offset: 2px; }

.wrap {
  max-width: 980px; margin: 0 auto;
  padding-block: 40px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}

/* header */
.hdr { display: flex; flex-direction: column; gap: 6px; }
.badge {
  align-self: flex-start; margin: 0; font: inherit; font-weight: 700; font-size: 15px;
  background: var(--purple); color: var(--badge-fg); padding: 2px 2ch;
}
.sub { color: var(--pink); margin: 4px 0 0; }
.pitch { color: var(--dim); margin: 0; max-width: 70ch; }
.links { display: flex; gap: 2px 3ch; flex-wrap: wrap; margin-top: 4px; }
.links a { color: var(--green); text-decoration: none; }
.links a:hover { text-decoration: underline; }
.links a::before { content: "→ "; color: var(--dim); }

/* tabs joined to window */
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; position: relative; z-index: 1; }
.tab {
  border: 1px solid var(--faint); border-bottom-color: var(--purple);
  border-radius: 8px 8px 0 0; padding: 4px 2.2ch; white-space: nowrap; color: var(--dim);
}
.tab + .tab { margin-left: -1px; }
.tab[aria-selected="true"] {
  border-color: var(--purple); border-bottom-color: var(--bg); color: var(--fg); font-weight: 700; background: var(--bg);
}
.tab:hover { color: var(--fg); }
.window {
  border: 1px solid var(--purple); border-radius: 0 10px 10px 10px;
  padding: 22px 2.5ch 18px; min-height: 420px;
}

/* list + detail */
.split { display: grid; grid-template-columns: minmax(0, 34ch) minmax(0, 1fr); gap: 24px 4ch; align-items: start; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { width: 100%; display: block; padding-left: calc(1ch + 2px); border-left: 2px solid transparent; }
.item .t { display: block; color: var(--fg); }
.item .d { display: block; color: var(--dim); font-size: 13px; }
.item:hover .t { color: var(--pink); }
.item[aria-current="true"] { border-left-color: var(--pink); }
.item[aria-current="true"] .t { color: var(--pink); }
.item[aria-current="true"] .d { color: color-mix(in srgb, var(--pink) 60%, var(--dim)); }
.status { color: var(--dim); font-size: 12px; margin: 14px 0 0 calc(1ch + 2px); }
.dots { letter-spacing: 0.2ch; }
.dots b { color: var(--fg); font-weight: 400; }

.box { border: 1px solid var(--faint); border-radius: 10px; padding: 16px 2.5ch; min-width: 0; }
.box h2 { margin: 0; font-size: 15px; color: var(--purple); text-wrap: balance; }
.box .meta { margin: 2px 0 14px; color: var(--dim); }
.box ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.box li { padding-left: 2ch; text-indent: -2ch; }
.box li::before { content: "• "; color: var(--pink); }
.box p { margin: 0 0 12px; max-width: 70ch; }
.box img { display: block; width: 100%; max-width: 240px; border-radius: 6px; margin-bottom: 14px; }

/* skills grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(26ch, 1fr)); gap: 14px; }
.grid .box h2 { font-size: 14px; margin-bottom: 8px; }
.grid .box ul { gap: 2px; }
.grid .box li::before { content: "› "; color: var(--dim); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; padding: 0; list-style: none; }
.chips li { background: color-mix(in srgb, var(--purple) 16%, transparent); color: var(--fg); padding: 0 1ch; }
.box .chips li::before { content: none; }
.box .chips li { text-indent: 0; padding-left: 1ch; }

.help { color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 0 1.5ch; }
.help b { color: var(--fg); font-weight: 500; }
.help .sep { color: var(--faint); }

@media (max-width: 720px) {
  .wrap { padding-block: 24px 20px; }
  .split { grid-template-columns: 1fr; }
  .window { padding: 18px 1.5ch; border-radius: 0 10px 10px 10px; }
  .help .kb { display: none; }
  .tab { padding: 4px 1.4ch; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr" id="hdr"></header>
  <div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <main class="window" id="win" role="tabpanel"></main>
  </div>
  <footer class="help">
    <span class="kb"><b>←/→</b> switch tab</span><span class="kb sep">•</span>
    <span class="kb"><b>↑/↓</b> select</span><span class="kb sep">•</span>
    <span>click anything</span>
  </footer>
</div>
<script src="data.js"></script>
<script>
(() => {
  const R = window.RESUME;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  $('hdr').innerHTML = `<h1 class="badge">${esc(R.profile.name)}</h1>
    <p class="sub">${esc(R.profile.title)} · ${esc(R.profile.discipline)}</p>
    <p class="pitch">${esc(R.profile.pitch)}</p>
    <nav class="links"><a href="${R.links.github.href}" target="_blank" rel="noopener">${R.links.github.label}</a>
    <a href="${R.links.linkedin.href}" target="_blank" rel="noopener">${R.links.linkedin.label}</a></nav>`;

  const TABS = ['Experience', 'Credits', 'Skills', 'About'];
  let tab = 0;
  const sel = { Experience: 1, Credits: 0 };

  $('tabs').innerHTML = TABS.map((t, i) => `<button class="tab" role="tab" data-i="${i}">${t}</button>`).join('');
  $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { tab = +b.dataset.i; render(); } });

  const dots = (n, i) => `<span class="dots">${Array.from({ length: n }, (_, k) => k === i ? '<b>●</b>' : '·').join('')}</span>`;

  function listView(name, items, title, desc, detail) {
    const i = sel[name];
    return `<div class="split"><div><ul class="list">${items.map((it, k) =>
      `<li><button class="item" data-k="${k}" aria-current="${k === i}"><span class="t">${esc(title(it))}</span><span class="d">${esc(desc(it))}</span></button></li>`).join('')}</ul>
      <p class="status">${i + 1}/${items.length} ${dots(items.length, i)}</p></div>
      <section class="box" aria-live="polite">${detail(items[i])}</section></div>`;
  }

  const VIEW = {
    Experience: () => listView('Experience', R.jobs, j => j.company.split(' / ')[0], j => `${j.title} · ${j.period}`,
      j => `<h2>${esc(j.title)}</h2><p class="meta">${esc(j.company)} · ${esc(j.period)}</p>` +
        (j.details.length ? `<ul>${j.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : `<p class="meta">Current role.</p>`)),
    Credits: () => listView('Credits', R.credits, c => c.title, c => `${c.year} · ${c.role}`,
      c => `<img src="${c.image}" alt="${esc(c.title)} box art" width="240"><h2>${esc(c.title)}</h2><p class="meta">${c.year} · ${esc(c.role)}</p>`),
    Skills: () => `<div class="grid">${R.skills.map(s => `<section class="box"><h2>${esc(s.label)}</h2><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></section>`).join('')}</div>`,
    About: () => `<section class="box" style="border:0;padding:0">${R.about.map(p => `<p>${esc(p)}</p>`).join('')}
      <h2 style="margin-top:18px">Focus</h2><ul class="chips">${R.specialties.map(s => `<li>${esc(s)}</li>`).join('')}</ul></section>`,
  };

  function render() {
    document.querySelectorAll('.tab').forEach((b, i) => b.setAttribute('aria-selected', i === tab));
    $('win').innerHTML = VIEW[TABS[tab]]();
  }
  $('win').addEventListener('click', e => {
    const b = e.target.closest('.item'); if (!b) return;
    sel[TABS[tab]] = +b.dataset.k; render();
    if (matchMedia('(max-width: 720px)').matches) $('win').querySelector('.box')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const name = TABS[tab];
    if (e.key === 'ArrowRight' || e.key === 'l') { tab = (tab + 1) % TABS.length; render(); }
    else if (e.key === 'ArrowLeft' || e.key === 'h') { tab = (tab + TABS.length - 1) % TABS.length; render(); }
    else if (name in sel && (e.key === 'ArrowDown' || e.key === 'j')) {
      sel[name] = Math.min((name === 'Experience' ? R.jobs : R.credits).length - 1, sel[name] + 1); render(); e.preventDefault();
    } else if (name in sel && (e.key === 'ArrowUp' || e.key === 'k')) { sel[name] = Math.max(0, sel[name] - 1); render(); e.preventDefault(); }
  });
  render();
})();
</script>
</body>
</html>
