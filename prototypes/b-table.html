<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jim Santora · Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: k9s-style. Info + view hotkeys + logo header, one framed resource table, describe view on select, crumbs at the bottom. */
:root {
  color-scheme: dark;
  --bg: #070b17;        /* navy-black */
  --fg: #b9c6de;
  --dim: #5c6987;
  --row: #5ed3f3;        /* table text, aqua */
  --head: #f2f5fb;
  --frame: #2c74e8;      /* dodger-blue frame */
  --title: #5ed3f3;
  --count: #ff5fd2;      /* fuchsia */
  --key: #ff9d2e;        /* orange labels / logo */
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--mono); }
a { color: var(--row); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px dashed var(--key); outline-offset: 2px; }

.app {
  height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
}

/* header */
.head { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 40px; align-items: start; }
.info { display: grid; grid-template-columns: max-content auto; gap: 0 1.5ch; margin: 0; }
.info dt { color: var(--key); }
.info dt::after { content: ":"; }
.info dd { margin: 0; color: var(--head); white-space: nowrap; }
.info dd a { color: var(--head); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
.info dd a:hover { color: var(--row); }
.menu { display: grid; grid-template-columns: repeat(2, max-content); gap: 0 4ch; margin: 0; padding: 0; list-style: none; }
.menu button { white-space: nowrap; text-align: left; }
.menu .kb { color: var(--count); }
.menu .lbl { color: var(--dim); }
.menu button:hover .lbl, .menu button[aria-current="true"] .lbl { color: var(--head); }
.logo { color: var(--key); margin: 0; font: inherit; line-height: 1.3; font-weight: 500; font-size: 13px; }

/* frame */
.frame {
  position: relative; flex: 1; min-height: 0;
  border: 1px solid var(--frame);
  padding: 12px 0 4px;
  display: flex; flex-direction: column;
}
.ftitle {
  position: absolute; top: -0.75em; left: 50%; transform: translateX(-50%);
  padding: 0 1ch; background: var(--bg); white-space: nowrap; margin: 0; font: inherit; font-weight: 700;
  color: var(--title);
}
.ftitle .c { color: var(--count); }
.ftitle .w { color: var(--head); }
.body { overflow: auto; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: var(--frame) transparent; }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 0 1.5ch; white-space: nowrap; }
th { color: var(--head); font-weight: 700; position: sticky; top: 0; background: var(--bg); }
th.sort::after { content: "↓"; color: var(--count); }
td { color: var(--row); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--row) 12%, transparent); }
tbody tr.sel td { background: var(--row); color: var(--bg); }
td.wrap { white-space: normal; min-width: 30ch; }
.num { text-align: right; }

/* describe */
.desc { padding: 4px 2ch 16px; }
.desc .k { color: var(--key); }
.desc .v { color: var(--head); }
.yaml { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 2ch; margin: 0 0 14px; }
.yaml dd { margin: 0; color: var(--head); }
.yaml dt { color: var(--key); }
.desc ul { list-style: none; margin: 0; padding: 0 0 0 2ch; max-width: 92ch; }
.desc li { color: var(--fg); padding-left: 2ch; text-indent: -2ch; margin-bottom: 6px; }
.desc li::before { content: "- "; color: var(--dim); }
.desc p { color: var(--fg); max-width: 76ch; margin: 0 0 10px 2ch; }
.desc .art { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.desc img { width: 200px; max-width: 100%; border: 1px solid var(--frame); }

/* crumbs */
.crumbs { display: flex; gap: 1ch; flex-wrap: wrap; align-items: center; }
.crumbs button { background: var(--frame); color: var(--head); padding: 0 1ch; }
.crumbs button:last-of-type { background: var(--key); color: var(--bg); }
.crumbs .hint { color: var(--dim); margin-left: auto; font-size: 12px; }

@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; }
  .head { grid-template-columns: 1fr; }
  .logo, .crumbs .hint { display: none; }
  .frame { flex: none; }
  .body { overflow: visible; }
  .opt { display: none; }
  td.wrap { min-width: 0; }
  th, td { padding: 0 1ch; }
  td:first-child { white-space: normal; }
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <dl class="info" id="info"></dl>
    <ul class="menu" id="menu"></ul>
    <pre class="logo" aria-hidden="true">   _ _
  (_|_)_ __ ___
  | | | '_ ` _ \
  | | | | | | | |
 _/ |_|_| |_| |_|
|__/</pre>
  </header>
  <section class="frame">
    <h1 class="ftitle" id="ftitle"></h1>
    <div class="body" id="body"></div>
  </section>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs"></nav>
</div>
<script src="data.js"></script>
<script>
(() => {
  const R = window.RESUME;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const NOW = 2026 + 10 / 12;
  const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };

  // "2022 – Jun 2026" → { from: '2022', to: 'Jun 2026', years: 4.4 }
  function span(period) {
    const [a, b = a] = period.split('–').map(s => s.trim());
    const t = (s, end) => {
      if (/present/i.test(s)) return NOW;
      const y = +(s.match(/\d{4}/) || [0])[0];
      const m = s.match(/[A-Za-z]{3}/);
      return y + (m ? MONTHS[m[0].toLowerCase()] / 12 : end ? 1 : 0);
    };
    const yrs = Math.max(0, t(b, true) - t(a, false));
    return { from: a, to: b === a ? a : b, age: yrs < 1 ? `${Math.round(yrs * 12)}mo` : `${Math.round(yrs)}y` };
  }

  const career = Math.round(NOW - 2001);
  $('info').innerHTML = [
    ['Name', esc(R.profile.name)],
    ['Role', esc(R.profile.title)],
    ['Focus', esc(R.profile.discipline)],
    ['Now', esc(R.jobs[0].company)],
    ['Career', `${career}y · ${R.jobs.length} roles · ${R.credits.length} game credits`],
    ['GitHub', `<a href="${R.links.github.href}" target="_blank" rel="noopener">${R.links.github.label}</a>`],
    ['LinkedIn', `<a href="${R.links.linkedin.href}" target="_blank" rel="noopener">${R.links.linkedin.label}</a>`],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  const VIEWS = {
    experience: {
      key: '1', items: R.jobs, scope: 'all',
      cols: [['COMPANY'], ['TITLE', 'opt'], ['FROM', 'sort'], ['TO', 'opt'], ['AGE', 'num'], ['NOTES', 'num opt']],
      row: j => { const s = span(j.period); return [j.company, j.title, s.from, s.to, s.age, j.details.length]; },
      id: j => j.slug,
      describe: j => `<dl class="yaml"><dt>Company</dt><dd>${esc(j.company)}</dd><dt>Title</dt><dd>${esc(j.title)}</dd><dt>Period</dt><dd>${esc(j.period)}</dd></dl>
        <div class="k">Highlights:</div>${j.details.length ? `<ul>${j.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : `<p>Current role.</p>`}`,
    },
    skills: {
      key: '2', items: R.skills, scope: 'all',
      cols: [['GROUP'], ['TOOLS', 'num'], ['ITEMS', 'wrap opt']],
      row: s => [s.label, s.items.length, s.items.join(', ')],
      id: s => s.dir,
      describe: s => `<dl class="yaml"><dt>Group</dt><dd>${esc(s.label)}</dd><dt>Tools</dt><dd>${s.items.length}</dd></dl>
        <div class="k">Items:</div><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`,
    },
    credits: {
      key: '3', items: R.credits, scope: 'shipped',
      cols: [['TITLE'], ['YEAR', 'sort'], ['CREDITED AS', 'opt']],
      row: c => [c.title, c.year, c.role],
      id: c => c.image.replace(/^images\/|\.jpg$/g, ''),
      describe: c => `<div class="art"><img src="${c.image}" alt="${esc(c.title)} box art" width="200">
        <dl class="yaml"><dt>Title</dt><dd>${esc(c.title)}</dd><dt>Year</dt><dd>${c.year}</dd><dt>Credited as</dt><dd>${esc(c.role)}</dd></dl></div>`,
    },
    about: {
      key: '4', items: [R.profile], scope: 'jim',
      cols: [['NAME'], ['TITLE'], ['FOCUS', 'opt']],
      row: p => [p.name, p.title, p.discipline],
      id: () => 'jim',
      describe: () => `<dl class="yaml"><dt>Name</dt><dd>${esc(R.profile.name)}</dd><dt>Title</dt><dd>${esc(R.profile.title)}</dd>
        <dt>Focus</dt><dd>${esc(R.profile.discipline)}</dd><dt>Employers</dt><dd>${R.profile.employers.map(esc).join(', ')}</dd>
        <dt>Specialties</dt><dd>${R.specialties.map(esc).join(', ')}</dd></dl>
        <div class="k">About:</div>${R.about.map(p => `<p>${esc(p)}</p>`).join('')}`,
    },
  };
  const ORDER = Object.keys(VIEWS);
  let view = 'experience', sel = 1, describing = false;

  $('menu').innerHTML = ORDER.map(v => `<li><button data-v="${v}"><span class="kb">&lt;${VIEWS[v].key}&gt;</span> <span class="lbl">${v}</span></button></li>`).join('') +
    `<li><button data-a="enter"><span class="kb">&lt;enter&gt;</span> <span class="lbl">describe</span></button></li>` +
    `<li><button data-a="esc"><span class="kb">&lt;esc&gt;</span> <span class="lbl">back</span></button></li>`;
  $('menu').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) go(b.dataset.v);
    else if (b.dataset.a === 'enter') { describing = true; render(); }
    else { describing = false; render(); }
  });

  function go(v) { if (v !== view) { view = v; sel = 0; } describing = false; render(); }

  function render() {
    const V = VIEWS[view], item = V.items[sel];
    document.querySelectorAll('#menu [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
    if (describing) {
      $('ftitle').innerHTML = `describe(<span class="c">${view}</span>/<span class="w">${esc(V.id(item))}</span>)`;
      $('body').innerHTML = `<div class="desc">${V.describe(item)}</div>`;
    } else {
      $('ftitle').innerHTML = `${view}(<span class="c">${V.scope}</span>)[<span class="w">${V.items.length}</span>]`;
      $('body').innerHTML = `<table><thead><tr>${V.cols.map(([h, c = '']) => `<th class="${c}">${h}</th>`).join('')}</tr></thead><tbody>` +
        V.items.map((it, i) => `<tr data-i="${i}" class="${i === sel ? 'sel' : ''}">${V.row(it).map((cell, k) => `<td class="${V.cols[k][1] || ''}">${esc(cell)}</td>`).join('')}</tr>`).join('') +
        `</tbody></table>`;
      $('body').querySelector('tr.sel')?.scrollIntoView({ block: 'nearest' });
    }
    $('body').scrollTop = describing ? 0 : $('body').scrollTop;
    const crumbs = [`<button data-c="list">${view}</button>`];
    if (describing) crumbs.push(`<button data-c="desc">${esc(V.id(item))}</button>`);
    $('crumbs').innerHTML = crumbs.join('') + `<span class="hint">click a row to describe · ↑↓ select · 1–4 views · esc back</span>`;
  }

  $('body').addEventListener('click', e => {
    const tr = e.target.closest('tbody tr'); if (!tr) return;
    sel = +tr.dataset.i; describing = true; render();
  });
  $('crumbs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b && b.dataset.c === 'list') { describing = false; render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const n = VIEWS[view].items.length;
    if (/^[1-4]$/.test(e.key)) go(ORDER[+e.key - 1]);
    else if (e.key === 'Escape') { describing = false; render(); }
    else if (e.key === 'Enter' && !e.target.closest('a,button')) { describing = true; render(); }
    else if (!describing && (e.key === 'ArrowDown' || e.key === 'j')) { sel = Math.min(n - 1, sel + 1); render(); e.preventDefault(); }
    else if (!describing && (e.key === 'ArrowUp' || e.key === 'k')) { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
  });

  render();
})();
</script>
</body>
</html>
