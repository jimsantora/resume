<!doctype html>
<html lang="en" data-skin="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jim Santora · Hybrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700;800&display=swap">
<style>
/* Layout: C's centered reading column, dressed in k9s's marks: info header with orange labels, <n> hotkeys,
   a framed window with its title in the border, inverse selection bar, crumbs at the bottom. */
:root {
  --bg: #090c14;
  --panel: #0d1220;
  --fg: #dfe5f0;
  --dim: #6f7a93;
  --frame: #2f6fe4;      /* k9s dodger-blue */
  --sel: #41cdf0;        /* aqua: titles + selection */
  --sel-fg: #071019;
  --label: #ff9a2e;      /* orange: info labels, active crumb */
  --count: #ff4fcf;      /* fuchsia: counts, hotkeys */
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-skin="day"] {
  --bg: #f5f6f9;
  --panel: #ffffff;
  --fg: #131a2a;
  --dim: #5e687e;
  --frame: #1d4fd8;
  --sel: #0a6fd8;
  --sel-fg: #ffffff;
  --label: #c9520a;
  --count: #c0158f;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.6 var(--mono); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px dashed var(--label); outline-offset: 3px; }

.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-block: 44px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 30px;
}

/* header */
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 48px; align-items: end; }
.name { margin: 0 0 14px; font-size: clamp(26px, 4.2vw, 38px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
.name .cur { color: var(--sel); font-weight: 400; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.info { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1px 2ch; margin: 0; }
.info dt { color: var(--label); }
.info dt::after { content: ":"; }
.info dd { margin: 0; }
.info a { text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
.info a:hover { color: var(--sel); text-decoration-color: var(--sel); }

.menu { display: grid; grid-template-columns: repeat(2, max-content); gap: 2px 4ch; margin: 0; padding: 0; list-style: none; }
.menu button { white-space: nowrap; }
.menu .kb { color: var(--count); }
.menu .lbl { color: var(--dim); }
.menu button:hover .lbl { color: var(--fg); }
.menu button[aria-current="true"] .lbl { color: var(--fg); font-weight: 700; }

/* window */
.win { position: relative; border: 1px solid var(--frame); background: var(--panel); padding: 26px 3ch 22px; }
.wtitle {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
  margin: 0; padding: 0 1.2ch; background: var(--bg); font: inherit; font-weight: 700; white-space: nowrap; color: var(--sel);
}
.wtitle .c { color: var(--count); }
.wtitle .w { color: var(--fg); }

.split { display: grid; grid-template-columns: minmax(0, 36ch) minmax(0, 1fr); gap: 24px 0; }
.list { list-style: none; margin: 0; padding: 0 2ch 0 0; border-right: 1px solid color-mix(in srgb, var(--frame) 45%, transparent); }
.row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 2ch; padding: 6px 1ch; }
.row .t { font-weight: 700; }
.row .d { grid-column: 1 / -1; color: var(--dim); font-size: 13px; }
.row .a { color: var(--dim); font-variant-numeric: tabular-nums; }
.row:hover { background: color-mix(in srgb, var(--sel) 12%, transparent); }
.row[aria-current="true"] { background: var(--sel); color: var(--sel-fg); }
.row[aria-current="true"] .d, .row[aria-current="true"] .a { color: color-mix(in srgb, var(--sel-fg) 72%, var(--sel)); }

.detail { padding: 2px 0 0 4ch; min-width: 0; }
.detail h2 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.meta { margin: 4px 0 18px; color: var(--dim); }
.meta b { color: var(--label); font-weight: 500; }
.detail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 72ch; }
.detail li { padding-left: 2ch; text-indent: -2ch; }
.detail li::before { content: "- "; color: var(--count); }
.detail p { margin: 0 0 14px; max-width: 70ch; }
.detail img { display: block; width: 100%; max-width: 230px; border: 1px solid var(--frame); margin-bottom: 18px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(27ch, 1fr)); gap: 22px 4ch; }
.grid h3 { margin: 0 0 6px; font-size: 14px; color: var(--sel); }
.grid h3 .c { color: var(--count); font-weight: 400; }
.grid ul { list-style: none; margin: 0; padding: 0; }
.grid li::before { content: "› "; color: var(--dim); }

.about { max-width: 72ch; }
.about p { margin: 0 0 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 3ch; margin: 18px 0 0; padding: 0; list-style: none; }
.tags li { color: var(--sel); }
.tags li::before { content: "#"; color: var(--dim); }

/* crumbs */
.crumbs { display: flex; flex-wrap: wrap; gap: 8px 1ch; align-items: center; }
.crumbs button { background: var(--frame); color: #fff; padding: 0 1.2ch; }
.crumbs button:last-of-type { background: var(--label); color: var(--sel-fg); }
:root[data-skin="day"] .crumbs button:last-of-type { color: #fff; }
.crumbs .sp { flex: 1; }
.crumbs .hint { color: var(--dim); font-size: 12px; }
.crumbs .skin { color: var(--dim); font-size: 12px; }
.crumbs .skin b { color: var(--count); font-weight: 400; }

@media (max-width: 760px) {
  .wrap { padding-block: 28px 20px; gap: 24px; }
  .head { grid-template-columns: 1fr; }
  .win { padding: 24px 1.5ch 18px; }
  .split { grid-template-columns: 1fr; }
  .list { border-right: 0; padding: 0; }
  .detail { padding: 18px 0 0; border-top: 1px solid color-mix(in srgb, var(--frame) 45%, transparent); }
  .crumbs .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .name .cur { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1 class="name" id="name"></h1>
      <dl class="info" id="info"></dl>
    </div>
    <ul class="menu" id="menu"></ul>
  </header>
  <main class="win">
    <h2 class="wtitle" id="wtitle"></h2>
    <div id="body" aria-live="polite"></div>
  </main>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs"></nav>
</div>
<script src="data.js"></script>
<script>
(() => {
  const R = window.RESUME;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const NOW = 2026 + 10 / 12;
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function age(period) {
    const [a, b = a] = period.split('–').map(s => s.trim());
    const t = (s, end) => {
      if (/present/i.test(s)) return NOW;
      const y = +(s.match(/\d{4}/) || [0])[0], m = s.match(/[A-Za-z]{3}/);
      return y + (m ? MON[m[0].toLowerCase()] / 12 : end ? 1 : 0);
    };
    const y = t(b, true) - t(a, false);
    return y < 1 ? `${Math.round(y * 12)}mo` : `${Math.round(y)}y`;
  }
  const short = c => c.split(' / ')[0];

  $('name').innerHTML = `${esc(R.profile.name)}<span class="cur" aria-hidden="true">_</span>`;
  $('info').innerHTML = [
    ['Role', `${esc(R.profile.title)} · ${esc(R.profile.discipline)}`],
    ['Now', esc(R.jobs[0].company)],
    ['Career', `${Math.round(NOW - 2001)}y · ${R.jobs.length} roles · ${R.credits.length} shipped games`],
    ['GitHub', `<a href="${R.links.github.href}" target="_blank" rel="noopener">${R.links.github.label}</a>`],
    ['LinkedIn', `<a href="${R.links.linkedin.href}" target="_blank" rel="noopener">${R.links.linkedin.label}</a>`],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  const VIEWS = {
    experience: { scope: 'all', items: R.jobs, id: j => j.slug,
      row: j => [short(j.company), age(j.period), `${j.title} · ${j.period}`],
      detail: j => `<h2>${esc(j.title)}</h2><p class="meta"><b>${esc(j.company)}</b> · ${esc(j.period)}</p>` +
        (j.details.length ? `<ul>${j.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : `<p class="meta">Current role.</p>`) },
    credits: { scope: 'shipped', items: R.credits, id: c => c.image.replace(/^images\/|\.jpg$/g, ''),
      row: c => [c.title, c.year, c.role],
      detail: c => `<img src="${c.image}" alt="${esc(c.title)} box art" width="230"><h2>${esc(c.title)}</h2><p class="meta"><b>${c.year}</b> · ${esc(c.role)}</p>` },
    skills: { scope: 'all', items: R.skills },
    about: { scope: 'jim', items: [1] },
  };
  const ORDER = Object.keys(VIEWS);
  let view = 'experience';
  const sel = { experience: 1, credits: 0 }; // opens on Epic Games; 2K has no bullets yet

  $('menu').innerHTML = ORDER.map((v, i) => `<li><button data-v="${v}"><span class="kb">&lt;${i + 1}&gt;</span> <span class="lbl">${v}</span></button></li>`).join('');
  $('menu').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });

  function go(v) { view = v; render(); }

  function render() {
    const V = VIEWS[view];
    document.querySelectorAll('#menu button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
    $('wtitle').innerHTML = `${view}(<span class="c">${V.scope}</span>)[<span class="w">${view === 'about' ? 1 : V.items.length}</span>]`;
    let html, crumb = '';
    if (view in sel) {
      const i = sel[view];
      html = `<div class="split"><ul class="list">${V.items.map((it, k) => {
        const [t, a, d] = V.row(it);
        return `<li><button class="row" data-k="${k}" aria-current="${k === i}"><span class="t">${esc(t)}</span><span class="a">${esc(a)}</span><span class="d">${esc(d)}</span></button></li>`;
      }).join('')}</ul><section class="detail">${V.detail(V.items[i])}</section></div>`;
      crumb = `<button data-c="item">${esc(V.id(V.items[i]))}</button>`;
    } else if (view === 'skills') {
      html = `<div class="grid">${R.skills.map(s => `<section><h3>${esc(s.label)} <span class="c">[${s.items.length}]</span></h3><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></section>`).join('')}</div>`;
    } else {
      html = `<div class="about">${R.about.map(p => `<p>${esc(p)}</p>`).join('')}<ul class="tags">${R.specialties.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`;
    }
    $('body').innerHTML = html;
    const skin = document.documentElement.dataset.skin;
    $('crumbs').innerHTML = `<button data-c="view">${view}</button>${crumb}<span class="sp"></span>` +
      `<span class="hint">click to select · ↑↓ · 1–4 views</span>` +
      `<button class="skin" data-c="skin" style="background:none;color:inherit;padding:0"><b>&lt;s&gt;</b> skin: ${skin}</button>`;
  }

  $('body').addEventListener('click', e => {
    const b = e.target.closest('.row'); if (!b) return;
    sel[view] = +b.dataset.k; render();
    if (matchMedia('(max-width: 760px)').matches)
      document.querySelector('.detail')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });
  const toggleSkin = () => { const r = document.documentElement; r.dataset.skin = r.dataset.skin === 'night' ? 'day' : 'night'; render(); };
  $('crumbs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.c === 'skin') toggleSkin(); });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[1-4]$/.test(e.key)) go(ORDER[+e.key - 1]);
    else if (e.key === 's') toggleSkin();
    else if (view in sel && (e.key === 'ArrowDown' || e.key === 'j')) { sel[view] = Math.min(VIEWS[view].items.length - 1, sel[view] + 1); render(); e.preventDefault(); }
    else if (view in sel && (e.key === 'ArrowUp' || e.key === 'k')) { sel[view] = Math.max(0, sel[view] - 1); render(); e.preventDefault(); }
  });
  render();
})();
</script>
</body>
</html>
